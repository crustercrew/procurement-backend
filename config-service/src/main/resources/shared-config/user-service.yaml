server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:54320}/procurement_user_db
    username: postgres
    password: "postgrespassword"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    # Flyway is invoked manually by FlywayDataInitializer (after Hibernate creates the schema),
    # not by Spring Boot's early auto-run which executes before Hibernate.
    enabled: false

springdoc:
  data-rest:
    enabled: false
  override-with-generic-response: false
