services:
  # ─────────────────────────────────────────────────────────────
  # PostgreSQL Database (Port 5432)
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: procurement-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: procurement_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "54320:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d procurement_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
  # ─────────────────────────────────────────────────────────────
  # pgAdmin (Opsional: Web UI untuk melihat isi tabel via browser)
  # Buka di browser: http://localhost:5050
  # ─────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: procurement-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@procurement.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
volumes:
  postgres_data:
